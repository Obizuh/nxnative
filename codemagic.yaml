  lm3-build:
    name: Luigi's Mansion 3 Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: "26.6"
      groups:
        - nxn-assets
    scripts:
      - name: Install build dependencies
        script: |
          brew install xcodegen zstd spirv-cross p7zip unar
          brew install --cask dotnet-sdk
          python3 -m pip install --user lz4 capstone fonttools "backports.zstd; python_version < '3.14'"
      - name: Fetch LM3 game files
        script: |
          set -e
          mkdir -p "$HOME/lm3-game" "$HOME/lm3-keys"
          curl -fL -o "$HOME/lm3-game/base.nsp" "http://3.221.158.118:18099/gx-4c1d9a/base.nsp"
          curl -fL -o "$HOME/lm3-game/update.nsp" "http://3.221.158.118:18099/gx-4c1d9a/update.nsp"
          curl -fL -o "$HOME/lm3-keys/prod.keys" "$NXN_ASSET_BASE/work/keys/prod_hactool.keys"
          ls -la "$HOME/lm3-game"
      - name: Prepare NSP folder
        script: |
          set -e
          find "$HOME/lm3-game" -mindepth 2 \( -name "*.nsp" -o -name "*.xci" \) -exec mv -n {} "$HOME/lm3-game/" \; || true
          ls -la "$HOME/lm3-game"
      - name: Patch dmsh_geometry clip_distance word order
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          python3 - <<'PYEOF'
          path = 'dm/gfx/tools/dmsh_geometry.py'
          src = open(path).read()
          old = r'''        v = re.fullmatch(r'float (\w+)\[(\d+)\] \[\[clip_distance\]\];', line)
          '''
          new = r'''        v = re.fullmatch(r'float (\w+)\[(\d+)\] \[\[clip_distance\]\];', line)
                  if not v:
                      v = re.fullmatch(r'float (\w+) \[\[clip_distance\]\] \[(\d+)\];', line)
          '''
          assert src.count(old) == 1, 'clip_distance anchor not found exactly once'
          open(path, 'w').write(src.replace(old, new))
          print('dmsh_geometry patched for LM3 gl_ClipDistance word order')
          PYEOF
      - name: Register shader toolchain
        script: |
          set -x
          metal_ok() { xcrun -sdk macosx metal --version 2>/dev/null | grep -qi metal; }
