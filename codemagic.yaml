          mkdir -p "$CM_BUILD_DIR/lm3-artifacts"
          find "$HOME" -name "*.ipa" -newer "$HOME/lm3-keys/prod.keys" -exec cp {} "$CM_BUILD_DIR/lm3-artifacts/" \; 2>/dev/null || true
